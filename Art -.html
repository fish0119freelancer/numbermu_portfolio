<style id="custom-slider-style-inline-css">

    .custom-slider {
        max-width: 1300px;
        height: 500px;
        margin: 0 auto;
        display: flex;
        align-items: flex-start;
        gap: 50px;
        padding: 20px;
        box-sizing: border-box;
    }

    .main-image {
        width: 800px;
        height: 500px;
        position: relative;
        border: 0px solid #ddd;
        // background-color: #f8f8f8;
        border-radius: 4px;
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
    }

    .main-image img {
        width: 100%;
        height: calc(100% - 40px); /* 減去標題的高度 */
        object-fit: contain;
        display: block;
    }

    .main-image p {
        margin: 0;
        padding: 10px;
        // background: rgba(255, 255, 255, 0.9);
        text-align: center;
        font-size: 16px;
        font-style: bold;
        color: #333;
        // border-top: 1px solid #eee;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .thumbnail-strip {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        gap: 10px;
        width: 350px;
        height: 500px;
        overflow-y: auto;
        padding-right: 10px;
        scrollbar-width: thin;
    }

    /* 自定義滾動條樣式 */
    .thumbnail-strip::-webkit-scrollbar {
        width: 6px;
    }

    .thumbnail-strip::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 3px;
    }

    .thumbnail-strip::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 3px;
    }

    .thumbnail-strip::-webkit-scrollbar-thumb:hover {
        background: #555;
    }

    .thumbnail {
        width: 100px;
        height: 100px;
        cursor: pointer;
        opacity: 0.7;
        transition: all 0.3s ease;
        border: 2px solid transparent;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
    }

    .thumbnail:hover {
        opacity: 0.9;
        transform: scale(1.02);
    }

    .thumbnail.active {
        opacity: 1;
        border: 2px solid #007bff;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    .thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

</style>

jQuery(document).ready(function($) {
            $(".thumbnail").click(function() {
                var $this = $(this);
                var imgSrc = $this.find("img").data("full");
                var imageCaption = $this.data("caption");
                
                $("#main-display").attr("src", imgSrc);
                $("#image-caption").text(imageCaption);
                
                $(".thumbnail").removeClass("active");
                $this.addClass("active");
            });
            
            // 確保第一張圖片被選中
            if($(".thumbnail").length > 0) {
                $(".thumbnail:first").addClass("active");
            }
        });
